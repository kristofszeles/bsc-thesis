# Cross-platform builds; on version tags (v*), uploads archives to a GitHub Release.
name: Build and release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    env:
      VERSION_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.sha) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: linux
          - os: windows-latest
            package: windows
          - os: macos-latest
            package: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.package == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake git pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-net-dev \
            libgtk-3-dev libglew-dev libglu1-mesa-dev zlib1g-dev \
            libwayland-dev \
            fakeroot

      - name: Build (Linux)
        if: matrix.package == 'linux'
        run: |
          set -euo pipefail
          (cd maze-server && sh build-linux-ci.sh)
          (cd maze-game && sh build-linux-ci.sh)

      - name: Package (Linux)
        if: matrix.package == 'linux'
        run: sh scripts/ci/package-release.sh linux "${{ env.VERSION_LABEL }}"

      - name: Build Debian package (Linux)
        if: matrix.package == 'linux'
        run: sh scripts/ci/linux/build-deb.sh "${{ env.VERSION_LABEL }}"

      - name: Setup MSBuild (Windows)
        if: matrix.package == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Generate Windows icons from textures/bg.png
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          python -m pip install "pillow>=10.0.0" --quiet
          python scripts/ci/win/png_to_ico.py maze-game/textures/bg.png maze-game/app.ico

      - name: Build (Windows)
        if: matrix.package == 'windows'
        run: msbuild bsc-thesis.sln /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

      - name: Package (Windows)
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Resolve-BuildExe([string]$projectDir, [string]$exeName) {
            $paths = @(
              (Join-Path $projectDir "Release\$exeName")
              (Join-Path $projectDir "Win32\Release\$exeName")
              (Join-Path $projectDir "Release\Win32\$exeName")
              (Join-Path $projectDir "x86\Release\$exeName")
            )
            foreach ($p in $paths) {
              if (Test-Path -LiteralPath $p) { return $p }
            }
            $found = Get-ChildItem -Path $projectDir -Recurse -Filter $exeName -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "(\\|/)(Release|RelWithDebInfo)(\\|/)" } |
              Select-Object -First 1
            if ($found) { return $found.FullName }
            throw "Could not find $exeName under $projectDir. Checked: $($paths -join ', ')"
          }
          $v = "${{ env.VERSION_LABEL }}"
          $name = "bsc-thesis-$v-windows-x86"
          New-Item -ItemType Directory -Force -Path "$name/maze-game", "$name/maze-server" | Out-Null
          $gameExe = Resolve-BuildExe "maze-game" "maze-game.exe"
          $serverExe = Resolve-BuildExe "maze-server" "maze-server.exe"
          Copy-Item -LiteralPath $gameExe "$name/maze-game/"
          Copy-Item "maze-game/*.dll" "$name/maze-game/"
          Copy-Item -Recurse "maze-game/textures", "maze-game/fonts", "maze-game/models" "$name/maze-game/"
          Copy-Item -LiteralPath $serverExe "$name/maze-server/"
          Copy-Item "maze-server/*.dll" "$name/maze-server/"
          if (Test-Path "${name}.zip") { Remove-Item "${name}.zip" }
          Compress-Archive -Path $name -DestinationPath "${name}.zip"
          Remove-Item -Recurse -Force $name

      - name: Install dependencies (macOS)
        if: matrix.package == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install cmake pkgconf sdl2 sdl2_image sdl2_net glew dylibbundler
          python3 -m venv "${GITHUB_WORKSPACE}/.ci-venv-macos"
          "${GITHUB_WORKSPACE}/.ci-venv-macos/bin/pip" install --upgrade pip
          "${GITHUB_WORKSPACE}/.ci-venv-macos/bin/pip" install "pillow>=10.0.0"

      - name: Build (macOS)
        if: matrix.package == 'macos'
        run: |
          cd maze-server && sh build-macos.sh && cd ..
          cd maze-game && sh build-macos.sh && cd ..

      - name: Create .app bundles and DMG (macOS)
        if: matrix.package == 'macos'
        run: |
          export PATH="${GITHUB_WORKSPACE}/.ci-venv-macos/bin:${PATH}"
          sh scripts/ci/macos-create-dmg.sh "${{ env.VERSION_LABEL }}"

      - name: Upload artifact (Linux)
        if: matrix.package == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ env.VERSION_LABEL }}
          path: |
            bsc-thesis-${{ env.VERSION_LABEL }}-linux-x86_64.tar.gz
            bsc-thesis-maze-game_*.deb
            bsc-thesis-maze-server_*.deb
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: matrix.package == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ env.VERSION_LABEL }}
          path: bsc-thesis-${{ env.VERSION_LABEL }}-windows-x86.zip
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: matrix.package == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ env.VERSION_LABEL }}
          path: bsc-thesis-${{ env.VERSION_LABEL }}-macos.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    # Use github.ref (not ref_type) + explicit needs.package.result so this job is not skipped incorrectly.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
