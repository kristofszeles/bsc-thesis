# Build a debug APK of maze-game with the Android NDK, linking against SDL2, SDL2_image, and SDL2_net.
name: Build Android APK (NDK)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK, NDK, CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Fetch SDL sources and Java shim
        run: |
          set -euo pipefail
          JNI="${GITHUB_WORKSPACE}/android/app/jni"
          JAVA_ORG="${GITHUB_WORKSPACE}/android/app/src/main/java"
          mkdir -p "$JNI" "$JAVA_ORG"
          git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git "$JNI/SDL"
          git clone --depth 1 --branch release-2.8.x https://github.com/libsdl-org/SDL_image.git "$JNI/SDL_image"
          git clone --depth 1 --branch release-2.2.x https://github.com/libsdl-org/SDL_net.git "$JNI/SDL_net"
          cp -a "$JNI/SDL/android-project/app/src/main/java/org" "$JAVA_ORG/"

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maze-game-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
